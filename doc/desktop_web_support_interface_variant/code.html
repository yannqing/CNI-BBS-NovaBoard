<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Support Interface</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom blur effect for the overlay */
        .glass-overlay {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-[#111418] dark:text-white min-h-screen relative overflow-hidden">
<!-- Mock Background Content to demonstrate overlay -->
<div class="absolute inset-0 z-0 p-8 opacity-20 pointer-events-none select-none flex flex-col gap-6">
<div class="h-16 w-full bg-slate-300 dark:bg-slate-700 rounded-lg"></div>
<div class="flex gap-6 h-full">
<div class="w-1/4 bg-slate-200 dark:bg-slate-800 rounded-lg h-96"></div>
<div class="flex-1 flex flex-col gap-4">
<div class="h-64 bg-slate-200 dark:bg-slate-800 rounded-lg"></div>
<div class="h-64 bg-slate-200 dark:bg-slate-800 rounded-lg"></div>
</div>
</div>
</div>
<!-- Blur Overlay -->
<div class="fixed inset-0 z-40 bg-black/20 dark:bg-black/50 glass-overlay transition-opacity duration-300"></div>
<!-- Main Modal Container -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
<!-- Modal -->
<div class="w-full max-w-3xl bg-white dark:bg-[#1a2632] rounded-xl shadow-2xl transform transition-all flex flex-col overflow-hidden max-h-[90vh]">
<!-- Modal Header with Close Button -->
<div class="px-8 pt-8 pb-4 flex justify-between items-start">
<div>
<h2 class="text-3xl font-bold tracking-tight text-[#111418] dark:text-white">Support Center</h2>
<p class="text-[#617589] dark:text-gray-400 mt-1">We're here to help. Search for answers or contact us directly.</p>
</div>
<button class="text-[#617589] dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800">
<span class="material-symbols-outlined" style="font-size: 28px;">close</span>
</button>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto px-8 pb-8">
<!-- Self Help Search Section -->
<div class="mt-4 mb-8">
<label class="block text-sm font-semibold text-[#111418] dark:text-white mb-2">Self Help</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#617589]" style="font-size: 24px;">search</span>
</div>
<input autofocus="" class="block w-full pl-12 pr-4 py-4 bg-[#f0f2f4] dark:bg-[#23303e] border-none rounded-lg text-[#111418] dark:text-white placeholder-[#617589] focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-[#1a2632] transition-all shadow-sm text-lg" placeholder="Search articles, guides, and FAQs..." type="text"/>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center">
<span class="text-xs font-medium text-[#617589] bg-white dark:bg-[#23303e] px-2 py-1 rounded border border-gray-200 dark:border-gray-700 hidden sm:block">CMD + K</span>
</div>
</div>
<!-- Quick Suggestions -->
<div class="flex gap-2 mt-3 overflow-x-auto pb-2 no-scrollbar">
<span class="text-xs font-medium text-[#617589] dark:text-gray-400 py-1">Popular:</span>
<button class="text-xs font-medium text-primary bg-primary/10 hover:bg-primary/20 px-3 py-1 rounded-full transition-colors whitespace-nowrap">Reset Password</button>
<button class="text-xs font-medium text-primary bg-primary/10 hover:bg-primary/20 px-3 py-1 rounded-full transition-colors whitespace-nowrap">Billing Issues</button>
<button class="text-xs font-medium text-primary bg-primary/10 hover:bg-primary/20 px-3 py-1 rounded-full transition-colors whitespace-nowrap">API Keys</button>
</div>
</div>
<div class="h-px bg-gray-100 dark:bg-gray-700 w-full mb-8"></div>
<!-- Direct Contact Section -->
<div>
<h3 class="text-xl font-bold text-[#111418] dark:text-white mb-5">Direct Contact</h3>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
<!-- Card 1: Live Chat -->
<button class="flex flex-col items-start p-5 rounded-lg border border-gray-100 dark:border-gray-700 hover:border-primary/50 hover:shadow-lg dark:hover:shadow-primary/10 bg-white dark:bg-[#23303e] transition-all group text-left">
<div class="bg-primary/10 dark:bg-primary/20 p-3 rounded-lg mb-4 group-hover:bg-primary group-hover:text-white text-primary transition-colors">
<span class="material-symbols-outlined" style="font-size: 28px;">chat</span>
</div>
<h4 class="text-lg font-bold text-[#111418] dark:text-white mb-1">Live Chat</h4>
<p class="text-sm text-[#617589] dark:text-gray-400 mb-3">Chat directly with a support agent.</p>
<div class="mt-auto flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
<span class="text-xs font-semibold text-green-600 dark:text-green-400">Online Now</span>
</div>
</button>
<!-- Card 2: Email -->
<button class="flex flex-col items-start p-5 rounded-lg border border-gray-100 dark:border-gray-700 hover:border-primary/50 hover:shadow-lg dark:hover:shadow-primary/10 bg-white dark:bg-[#23303e] transition-all group text-left">
<div class="bg-primary/10 dark:bg-primary/20 p-3 rounded-lg mb-4 group-hover:bg-primary group-hover:text-white text-primary transition-colors">
<span class="material-symbols-outlined" style="font-size: 28px;">mail</span>
</div>
<h4 class="text-lg font-bold text-[#111418] dark:text-white mb-1">Email Support</h4>
<p class="text-sm text-[#617589] dark:text-gray-400 mb-3">Send us a detailed message.</p>
<div class="mt-auto flex items-center gap-2">
<span class="material-symbols-outlined text-[#617589]" style="font-size: 14px;">schedule</span>
<span class="text-xs font-semibold text-[#617589] dark:text-gray-400">Replies within 24h</span>
</div>
</button>
<!-- Card 3: Phone -->
<button class="flex flex-col items-start p-5 rounded-lg border border-gray-100 dark:border-gray-700 hover:border-primary/50 hover:shadow-lg dark:hover:shadow-primary/10 bg-white dark:bg-[#23303e] transition-all group text-left">
<div class="bg-primary/10 dark:bg-primary/20 p-3 rounded-lg mb-4 group-hover:bg-primary group-hover:text-white text-primary transition-colors">
<span class="material-symbols-outlined" style="font-size: 28px;">call</span>
</div>
<h4 class="text-lg font-bold text-[#111418] dark:text-white mb-1">Book a Call</h4>
<p class="text-sm text-[#617589] dark:text-gray-400 mb-3">Schedule a time to speak with us.</p>
<div class="mt-auto flex items-center gap-2">
<span class="material-symbols-outlined text-[#617589]" style="font-size: 14px;">calendar_month</span>
<span class="text-xs font-semibold text-[#617589] dark:text-gray-400">Next slot: Today, 2pm</span>
</div>
</button>
</div>
</div>
<!-- Footer Link -->
<div class="mt-8 text-center">
<a class="inline-flex items-center gap-1 text-sm font-semibold text-primary hover:text-blue-700 dark:hover:text-blue-400 transition-colors" href="#">
                        Visit full Help Center 
                        <span class="material-symbols-outlined" style="font-size: 16px;">arrow_forward</span>
</a>
</div>
</div>
<!-- Modal Footer Gradient Line -->
<div class="h-1.5 w-full bg-gradient-to-r from-blue-400 via-primary to-blue-600"></div>
</div>
</div>
<!-- Floating Action Button (FAB) Bottom Left -->
<div class="fixed bottom-8 left-8 z-50 flex items-center gap-4 group">
<!-- Button -->
<button class="h-16 w-16 bg-primary hover:bg-blue-600 text-white rounded-full shadow-lg hover:shadow-primary/40 flex items-center justify-center transition-all transform hover:scale-110 active:scale-95">
<span class="material-symbols-outlined" style="font-size: 32px;">chat_bubble</span>
</button>
<!-- Tooltip -->
<div class="bg-white dark:bg-[#1a2632] text-[#111418] dark:text-white px-4 py-2 rounded-lg shadow-lg border border-gray-100 dark:border-gray-700 animate-fade-in-up opacity-100 transition-opacity">
<span class="text-sm font-medium whitespace-nowrap">How can we help?</span>
<!-- Triangle Pointer -->
<div class="absolute left-[-6px] top-1/2 -translate-y-1/2 w-3 h-3 bg-white dark:bg-[#1a2632] border-l border-b border-gray-100 dark:border-gray-700 transform rotate-45"></div>
</div>
</div>
</body></html>
